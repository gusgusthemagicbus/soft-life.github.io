
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Life</title>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <style>
    html {
      background-color: brown;
      }
    marquee {
      color: white;
      font-family: Stencil;
      }
    a.pricing {
      border: 8px double darkgoldenrod;
      border-radius: 3px;
      padding: 2px;
      background-color: white;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);
      color: darkgoldenrod;
      font-family: Impact;
    }
    p {
      font-family: Impact;
      font-size: 22px;
    }
    p.caption {
      opacity: 0.75;
      color: gray;
      }
    </style>
    <style>
      ul {
        display: flex;
        align-items: center;
        background-color: #ff8c5e;
        list-style: none;
        padding: .5em;
        margin: 0;
        }
        
      li {
        margin: 0 1em; 
        font-weight: bold;
        }
      
      li.logo {
        margin-right: auto;
        }  
      
      a.baronbottom {
        border: 8px inset #00af8f;
        padding: 1px;
        color: #00af8f;
        background-color: white;
        box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);
        font-family: monospace;
        border-radius: 1px;
        }
      a.baronbottom2 {
        border: 8px outset darkblue;
        padding: 1px;
        color: darkblue;
        background-color: white;
        box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);
        font-family: monospace;
        border-radius: 1px;
        }
      a.baronbottom3 {
        border: 8px outset darkorange;
        padding: 1px;
        color: darkorange;
        background-color: white;
        box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);
        font-family: monospace;
        border-radius: 1px;
        }

    </style>
  </head>
  <body>
    <marquee style="font-size: 28px" behavior="alternate">Welcome to the Soft Life home page where all of your carbonated dreams come true</marquee>
    <div></div>
    <center>
    <p>Say NO to artificial sodas and YES to Soft Life</p>
      </center>
    <div></div>
    <center>
    <img src="favicon.ico" height="500" width="500">
    <p class="caption">"Making all of your carbonated dreams come true"</p>
    </center>
    
    <!-- bar at the bottom -->
    
    <bottom style="position: fixed; bottom: 0; left: 0; width: 100%;">
    <ul style="margin-top: auto;">
      <li class="logo"><img src="logo.png"></li>
      <a href="https://soft-life.neocities.org/about" class="baronbottom3">
      <li>About</li>
      </a>
      <a href="https://soft-life.neocities.org/pricing" class="baronbottom">
      <li>Pricing</li>
      </a>
      <a href="https://soft-life.neocities.org/contact" class="baronbottom2">
      <li>Contact Us</li>
      </a>
    </ul>
    </bottom>
  </body>
</html>
